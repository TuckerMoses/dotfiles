# ── Atuin shell history ──────────────────────────────────────────────────────

# Search mode: fuzzy (default), prefix, fulltext, or skim
search_mode = "fuzzy"

# Filter mode when pressing Ctrl+R: global, host, session, or directory
filter_mode = "global"

# Filter mode for up-arrow: directory-scoped (most useful)
filter_mode_shell_up_key_binding = "directory"

# Style: auto picks compact for small terminals, full otherwise
style = "auto"

# Show preview of full command
show_preview = true

# Inline height (0 = fullscreen overlay)
inline_height = 0

# Sync is off twice over: there is no server to talk to (Atuin's default is
# https://api.atuin.sh), and nothing syncs in the background even if one is set.
# To sync on purpose, both lines have to change.
sync_address = ""
auto_sync = false

# Store duration and exit code
store_failed = true
