# herdr-plus worktree layout: fills a herdr git worktree of this repo when it is created or
# reopened (matched on the repo's basename). Stowed from ~/dotfiles/herdr.
repo = "dotfiles"

[[tabs]]
name = "claude"
command = "claude"

[[tabs]]
name = "lazygit"
command = "lazygit"

[[tabs]]
name = "shell"
